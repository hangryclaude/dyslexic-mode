<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse" x="60" y="120">
      <path d="M100 0 L0 0 L0 100" fill="none" stroke="#333" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#fff"/>

  <!-- grid -->
  <rect x="60" y="120" width="500" height="500" fill="url(#g)" stroke="#333" stroke-width="2"/>

  <!-- column numbers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222" text-anchor="middle">
    <text x="110" y="660">1</text>
    <text x="210" y="660">2</text>
    <text x="310" y="660">3</text>
    <text x="410" y="660">4</text>
    <text x="510" y="660">5</text>
    <text x="310" y="700" font-weight="bold">COLUMN</text>
  </g>

  <!-- row numbers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222" text-anchor="middle">
    <text x="35" y="177">5</text>
    <text x="35" y="277">4</text>
    <text x="35" y="377">3</text>
    <text x="35" y="477">2</text>
    <text x="35" y="577">1</text>
    <text x="35" y="100" font-weight="bold">ROW</text>
  </g>

  <!-- start position -->
  <circle cx="210" cy="470" r="40" fill="#ffd54f" stroke="#333" stroke-width="2"/>
  <text x="210" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">START</text>

  <!-- move list -->
  <text x="620" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#222">MOVES</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222">
    <text x="620" y="200">1. right 2</text>
    <text x="620" y="270">2. up 2</text>
    <text x="620" y="340">3. left 3</text>
    <text x="620" y="410">4. down 1</text>
    <text x="620" y="480">5. right 1</text>
    <text x="620" y="550">6. up 1</text>
  </g>
</svg>