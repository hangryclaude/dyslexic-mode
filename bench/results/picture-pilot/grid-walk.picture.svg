<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/>
    </marker>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- grid cells -->
  <g fill="#f4f7fb" stroke="#333" stroke-width="2">
    <rect x="100" y="100" width="120" height="120"/>
    <rect x="220" y="100" width="120" height="120"/>
    <rect x="340" y="100" width="120" height="120"/>
    <rect x="460" y="100" width="120" height="120"/>
    <rect x="580" y="100" width="120" height="120"/>
    <rect x="100" y="220" width="120" height="120"/>
    <rect x="220" y="220" width="120" height="120"/>
    <rect x="340" y="220" width="120" height="120"/>
    <rect x="460" y="220" width="120" height="120"/>
    <rect x="580" y="220" width="120" height="120"/>
    <rect x="100" y="340" width="120" height="120"/>
    <rect x="220" y="340" width="120" height="120"/>
    <rect x="340" y="340" width="120" height="120"/>
    <rect x="460" y="340" width="120" height="120"/>
    <rect x="580" y="340" width="120" height="120"/>
    <rect x="100" y="460" width="120" height="120"/>
    <rect x="220" y="460" width="120" height="120"/>
    <rect x="340" y="460" width="120" height="120"/>
    <rect x="460" y="460" width="120" height="120"/>
    <rect x="580" y="460" width="120" height="120"/>
    <rect x="100" y="580" width="120" height="120"/>
    <rect x="220" y="580" width="120" height="120"/>
    <rect x="340" y="580" width="120" height="120"/>
    <rect x="460" y="580" width="120" height="120"/>
    <rect x="580" y="580" width="120" height="120"/>
  </g>

  <!-- column numbers -->
  <g font-size="24" text-anchor="middle" fill="#222">
    <text x="160" y="740">1</text>
    <text x="280" y="740">2</text>
    <text x="400" y="740">3</text>
    <text x="520" y="740">4</text>
    <text x="640" y="740">5</text>
    <text x="400" y="780" font-size="22">column</text>
  </g>

  <!-- row numbers -->
  <g font-size="24" text-anchor="middle" fill="#222">
    <text x="70" y="168">5</text>
    <text x="70" y="288">4</text>
    <text x="70" y="408">3</text>
    <text x="70" y="528">2</text>
    <text x="70" y="648">1</text>
    <text x="50" y="92" font-size="22">row</text>
  </g>

  <!-- path segments -->
  <g stroke="#1f4e9c" stroke-width="5" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="520" x2="508" y2="520"/>
    <line x1="520" y1="520" x2="520" y2="292"/>
    <line x1="520" y1="280" x2="172" y2="280"/>
    <line x1="160" y1="280" x2="160" y2="388"/>
    <line x1="160" y1="400" x2="268" y2="400"/>
    <line x1="280" y1="400" x2="280" y2="292"/>
  </g>

  <!-- start marker -->
  <circle cx="280" cy="520" r="10" fill="#2e8b57"/>
  <text x="280" y="496" font-size="20" text-anchor="middle" fill="#2e8b57" font-weight="bold">START</text>

  <!-- move numbers -->
  <g font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="400" cy="490" r="17" fill="#c0392b"/>
    <text x="400" y="497">1</text>
    <circle cx="550" cy="400" r="17" fill="#c0392b"/>
    <text x="550" y="407">2</text>
    <circle cx="340" cy="250" r="17" fill="#c0392b"/>
    <text x="340" y="257">3</text>
    <circle cx="125" cy="340" r="17" fill="#c0392b"/>
    <text x="125" y="347">4</text>
    <circle cx="220" cy="430" r="17" fill="#c0392b"/>
    <text x="220" y="437">5</text>
    <circle cx="245" cy="340" r="17" fill="#c0392b"/>
    <text x="245" y="347">6</text>
  </g>
</svg>